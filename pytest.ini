[pytest]
testpaths = apps/api/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
addopts = -q --strict-markers --strict-config
filterwarnings =
    ignore::DeprecationWarning
markers =
    integration: exercises real media/AI work (slower; needs FFmpeg)
    e2e: full workflow through the HTTP API
