# ClipForge — full stack.
#
#   cp .env.example .env          # then set SECRET_KEY and JWT_SECRET
#   docker compose up --build     # http://localhost:8080
#
# Services: web (nginx + SPA), api (FastAPI), worker (jobs), postgres, redis,
# minio (S3-compatible storage) and processor (optional Rust sidecar). The API
# and worker run the *same image* with different commands, so they cannot drift.
#
# `docker compose up -d --scale worker=4` adds job capacity; `--scale api=2`
# scales the HTTP tier. Redis holds the queue and pub/sub, so workers on any host
# can pick up work.

name: clipforge

x-api-env: &api-env
  ENVIRONMENT: ${ENVIRONMENT:-production}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  LOG_JSON: ${LOG_JSON:-true}
  SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env (python -c "import secrets; print(secrets.token_urlsafe(48))")}
  JWT_SECRET: ${JWT_SECRET:-}
  ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
  COOKIE_SECURE: ${COOKIE_SECURE:-false}
  COOKIE_SAMESITE: ${COOKIE_SAMESITE:-lax}
  DATABASE_URL: postgresql+psycopg://clipforge:${POSTGRES_PASSWORD:-clipforge}@postgres:5432/clipforge
  REDIS_URL: redis://redis:6379/0
  QUEUE_BACKEND: redis
  CACHE_BACKEND: redis
  STORAGE_BACKEND: s3
  S3_ENDPOINT: http://minio:9000
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:-clipforge}
  S3_SECRET_KEY: ${S3_SECRET_KEY:-clipforge-secret}
  S3_BUCKET: ${S3_BUCKET:-clipforge}
  S3_PREFIX: ${S3_PREFIX:-media}
  S3_PATH_STYLE: "true"
  AUTO_CREATE_TABLES: "true"          # production: run `alembic upgrade head` instead
  FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
  MEDIA_FFMPEG_PATH: /usr/bin/ffmpeg
  MEDIA_FFPROBE_PATH: /usr/bin/ffprobe
  FONT_DIRECTORY: /usr/share/fonts
  VISION_ENABLED: ${VISION_ENABLED:-true}
  VISION_FACE_DETECTOR: ${VISION_FACE_DETECTOR:-auto}
  AI_TRANSCRIPTION_PROVIDER: ${AI_TRANSCRIPTION_PROVIDER:-auto}
  AI_LLM_PROVIDER: ${AI_LLM_PROVIDER:-auto}
  WHISPER_MODEL: ${WHISPER_MODEL:-base}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  RATE_LIMIT_ENABLED: "true"
  PROCESSOR_ENABLED: ${PROCESSOR_ENABLED:-true}
  PROCESSOR_URL: http://processor:8100
  PROCESSOR_TIMEOUT_SECONDS: ${PROCESSOR_TIMEOUT_SECONDS:-300}

services:
  # ------------------------------------------------------------- datastores ---
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: clipforge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-clipforge}
      POSTGRES_DB: clipforge
      # Faster startup in development; remove for production datasets.
      POSTGRES_INITDB_ARGS: "--data-checksums"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clipforge -d clipforge"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [clipforge]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [clipforge]

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-clipforge}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-clipforge-secret}
    ports:
      # Host mapping is for debugging (console at http://localhost:9001).
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [clipforge]

  # Creates the bucket once MinIO is healthy, then exits. Video binaries live
  # here, never in PostgreSQL.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${S3_ACCESS_KEY:-clipforge} ${S3_SECRET_KEY:-clipforge-secret} &&
      mc mb --ignore-existing local/${S3_BUCKET:-clipforge} &&
      echo 'bucket ${S3_BUCKET:-clipforge} ready'
      "
    networks: [clipforge]
    restart: "no"

  # ----------------------------------------------------------------- compute ---
  api:
    build:
      context: .
      dockerfile: infrastructure/Dockerfile.api
    image: clipforge-api:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      <<: *api-env
      # Each API process runs its own inline worker pool. Scaling the API tier
      # then also scales job throughput; set WORKER_INLINE=false to split them.
      WORKER_INLINE: ${API_WORKER_INLINE:-true}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      # Shared scratch space for materialized media (spool files, job workspaces).
      - media-work:/srv/app/.data
    networks: [clipforge]

  worker:
    image: clipforge-api:latest
    build:
      context: .
      dockerfile: infrastructure/Dockerfile.api
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      <<: *api-env
      WORKER_INLINE: "false"          # a dedicated process, not a thread pool
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}
      RENDER_CONCURRENCY: ${RENDER_CONCURRENCY:-1}
    command: ["python", "-m", "app.workers.worker"]
    volumes:
      - media-work:/srv/app/.data
    networks: [clipforge]
    # `docker compose up --scale worker=N` adds capacity without further config.

  processor:
    build:
      context: apps/processor/rust
      dockerfile: Dockerfile
    image: clipforge-processor:latest
    restart: unless-stopped
    environment:
      PROCESSOR_BIND: 0.0.0.0:8100
      RUST_LOG: ${RUST_LOG:-info}
      LOG_JSON: ${LOG_JSON:-true}
    expose:
      - "8100"
    networks: [clipforge]

  # ------------------------------------------------------------------ frontend ---
  web:
    build:
      context: apps/web
      dockerfile: Dockerfile
    image: clipforge-web:latest
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    ports:
      - "${WEB_PORT:-8080}:80"
    networks: [clipforge]

volumes:
  postgres-data:
  redis-data:
  minio-data:
  # Shared between api and worker: both must see the same materialized files.
  media-work:

networks:
  clipforge:
    driver: bridge
