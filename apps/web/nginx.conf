# nginx config for the ClipForge web container.
#
# Two jobs: serve the SPA with correct caching, and proxy API/WebSocket traffic to
# the API container so the browser stays on a single origin (cookies, no CORS).

upstream clipforge_api {
    # `api` is the compose service name; Docker's embedded DNS resolves it.
    server api:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # Uploaded videos can be large: raise the body limits well above the chunk size.
    client_max_body_size 512m;
    client_body_timeout 300s;

    # Long-running media work reports progress over WebSocket; do not time it out.
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               application/wasm image/svg+xml;
    gzip_min_length 1024;

    root /usr/share/nginx/html;
    index index.html;

    # Hashed build artifacts are immutable.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Never cache the shell: a stale index.html would pin an old bundle.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location /api/ {
        proxy_pass http://clipforge_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Streamed upload chunks and range requests must not be buffered to disk.
        proxy_request_buffering off;
    }

    # WebSocket endpoint for live job/render/caption events.
    location /ws/ {
        proxy_pass http://clipforge_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_read_timeout 3600s;
    }

    location = /healthz {
        proxy_pass http://clipforge_api;
        access_log off;
    }

    location = /readyz {
        proxy_pass http://clipforge_api;
        access_log off;
    }

    # Swagger UI and the raw schema, proxied so /docs works from the web origin.
    location /docs {
        proxy_pass http://clipforge_api;
        proxy_set_header Host $host;
    }

    location /openapi.json {
        proxy_pass http://clipforge_api;
        proxy_set_header Host $host;
    }

    # SPA fallback: every client-side route resolves to the app shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
