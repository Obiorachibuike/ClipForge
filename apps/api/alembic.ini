# Alembic configuration for ClipForge.
#
# The database URL is read from DATABASE_URL (the same variable the API and
# worker use) by alembic/env.py; it is intentionally not stored here.
#
# Usage (from apps/api, or with `alembic -c apps/api/alembic.ini`):
#   alembic upgrade head
#   alembic current
#   alembic downgrade -1
#
# In production run `alembic upgrade head` before starting new API/worker
# processes, then set AUTO_CREATE_TABLES=false.

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = %(here)s
path_separator = os
version_path_separator = os
# Timestamps in filenames make migration order obvious during review.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
